<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Control Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex">
        <div class="sidebar">
            <h2 class="sidebar-title mb-4">Control Panel</h2>
            <div class="control-section mb-4">
                <h6 class="control-title">Virtual Machine</h6>
                <button class="btn btn-success control-btn" id="start-vm">Start VM</button>
                <button class="btn btn-danger control-btn" id="stop-vm">Stop VM</button>
            </div>
            <div class="control-section mb-4">
                <h6 class="control-title">Unity Testing</h6>
                <button class="btn btn-primary control-btn" id="run-tests">Run Tests</button>
            </div>
            <div class="control-section">
                <h6 class="control-title">Performance</h6>
                <button class="btn btn-info control-btn" onclick="showGraph('cumulative')">Cumulative Reward</button>
                <button class="btn btn-info control-btn" onclick="showGraph('goals')">Goals Histogram</button>
            </div>
        </div>
        <div class="container-fluid p-4">
            <h1 class="text-center mb-4">VM Control and Performance Dashboard</h1>
            <div class="row">
                <div class="col-md-4">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h4>Raw Data</h4>
                        </div>
                        <div class="card-body">
                            <p><strong>Tasks Completed:</strong> <span id="tasks-completed">Loading...</span></p>
                            <p><strong>Goals (Team 1):</strong> <span id="goals-team1">Loading...</span></p>
                            <p><strong>Goals (Team 2):</strong> <span id="goals-team2">Loading...</span></p>
                        </div>
                    </div>
                </div>
                <div class="col-md-8">
                    <div class="card mb-4">
                        <div class="card-header">
                            <h4>Performance Graph</h4>
                        </div>
                        <div class="card-body">
                            <!-- Cumulative Reward Graph -->
                            <canvas id="cumulativeGraph" class="graph" height="200"></canvas>
                            <!-- Goals Histogram Graph -->
                            <canvas id="goalsHistogram" class="graph" height="200" style="display:none;"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
